[package]
name = "butler"
version = "0.1.0"
description = "Project Butler - Personal AI Butler"
authors = ["butler-team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "butler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2" }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["full"] }

# LLM Runtime — llama.cpp via Rust bindings
llama-cpp-2 = "0.1"

# Misc
anyhow = "1"
parking_lot = "0.12"
dirs-next = "2"

